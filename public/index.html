<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Копейка — учёт личных финансов</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23b8742f'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='%23fff' font-family='sans-serif' font-weight='700'%3E%E2%82%BD%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="topbar">
    <div class="wrap topbar__in">
        <a class="brand" href="#/transactions"><span class="coin" aria-hidden="true">₽</span>Копейка</a>
        <nav id="nav" aria-label="Разделы">
            <a href="#/transactions" data-route="transactions">Операции</a>
            <a href="#/reports" data-route="reports">Отчёты</a>
            <a href="#/categories" data-route="categories">Категории</a>
            <a href="#/rates" data-route="rates">Курсы</a>
        </nav>
    </div>
</header>

<main class="wrap" id="app"></main>

<dialog id="tx-dialog" aria-labelledby="tx-title">
    <form id="tx-form" novalidate>
        <h2 id="tx-title">Новая операция</h2>

        <div class="seg" role="radiogroup" aria-label="Тип операции">
            <input type="radio" id="type-expense" name="type" value="expense" checked>
            <label for="type-expense">Расход</label>
            <input type="radio" id="type-income" name="type" value="income">
            <label for="type-income">Доход</label>
        </div>

        <div class="grid2">
            <label class="field">Сумма
                <input name="amount" inputmode="decimal" autocomplete="off" placeholder="1250,50" required>
                <small class="err" data-err="amount"></small>
            </label>
            <label class="field">Валюта
                <select name="currency"></select>
                <small class="err" data-err="currency"></small>
            </label>
        </div>

        <label class="field">Категория
            <select name="category_id"></select>
            <small class="err" data-err="category_id"></small>
        </label>

        <label class="field">Дата
            <input type="date" name="occurred_on" required>
            <small class="err" data-err="occurred_on"></small>
        </label>

        <label class="field">Заметка
            <input name="note" maxlength="255" placeholder="Необязательно">
            <small class="err" data-err="note"></small>
        </label>

        <p class="err" id="tx-error" role="alert"></p>

        <div class="dialog__actions">
            <button class="btn btn--ghost" type="button" id="tx-cancel">Отмена</button>
            <button class="btn" type="submit">Сохранить</button>
        </div>
    </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="/assets/app.js" defer></script>
</body>
</html>
